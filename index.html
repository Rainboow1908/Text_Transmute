<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TextTransmuter</title>
  <link rel="icon" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <div class="lang-switch">
      <button id="lang-zh" class="lang-btn" type="button">中</button>
      <button id="lang-en" class="lang-btn" type="button">EN</button>
    </div>
    <h1>TextTransmuter</h1>
    <p data-i18n="hero">输入文本，用可插拔内核转换成任意形式，也能反向还原。</p>
  </header>

  <!-- 转换器视图 -->
  <main id="view-converter">
    <!-- 内核选择区 -->
    <section class="card">
      <div class="section-head">
        <h2 data-i18n="kernelTitle">转换内核</h2>
        <div class="toolbar">
          <button id="upload-btn" class="btn" type="button" data-i18n="upload">上传内核</button>
          <button id="download-btn" class="btn btn-ghost" type="button" data-i18n="download">下载当前内核</button>
          <a class="btn btn-ghost" href="market.html" data-i18n="navMarket">内核市场</a>
          <a class="btn btn-ghost" href="docs/kernel-spec.html" data-i18n="spec">内核规范</a>
        </div>
        <input id="file-input" type="file" accept=".json,application/json" hidden />
      </div>

      <div class="tabs">
        <span class="tab-label" data-i18n="builtin">内置</span>
        <div id="builtin-tabs" class="tab-group"></div>
        <span class="tab-label" id="uploaded-label" data-i18n="uploaded" hidden>已上传</span>
        <div id="uploaded-tabs" class="tab-group"></div>
      </div>

      <div id="kernel-info" class="kernel-info"></div>

      <div id="settings" class="settings" hidden></div>
    </section>

    <!-- 转换区 -->
    <section class="card">
      <div class="io-grid">
        <div class="io-col">
          <div class="io-head">
            <label for="human-input" data-i18n="inputLabel">输入</label>
            <button id="copy-human" class="mini-btn" type="button" data-i18n="copy">复制</button>
          </div>
          <textarea id="human-input" rows="7" data-i18n-placeholder="inputPlaceholder" placeholder="在这里输入原始文本…"></textarea>
        </div>

        <div class="io-mid">
          <button id="to-meow" class="btn btn-primary" type="button" data-i18n="transform">转换 →</button>
          <button id="to-human" class="btn" type="button" data-i18n="restore">← 还原</button>
        </div>

        <div class="io-col">
          <div class="io-head">
            <label for="meow-input" data-i18n="outputLabel">输出</label>
            <button id="copy-meow" class="mini-btn" type="button" data-i18n="copy">复制</button>
          </div>
          <textarea id="meow-input" rows="7" data-i18n-placeholder="outputPlaceholder" placeholder="在这里输入转换文本…"></textarea>
        </div>
      </div>

      <div id="error-box" class="error-box" hidden></div>
    </section>
  </main>

  <footer>
    <p data-i18n="footer">© 2026 Rainboow1908 · 本工具仅供学习与娱乐，转换/加密不保证安全性，请勿用于敏感数据。</p>
  </footer>

  <script src="js/kernels.js"></script>
  <script src="js/float-words.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
