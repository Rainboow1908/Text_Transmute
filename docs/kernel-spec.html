<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内核规范 · TextTransmuter</title>
  <link rel="icon" href="../favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .doc { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
    .doc-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .lang-switch-inline { display: inline-flex; gap: 4px; }
    .doc h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .doc h2 { margin-top: 28px; font-size: 1.15rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .doc h3 { margin-top: 20px; font-size: 1.02rem; }
    .doc table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.92rem; }
    .doc th, .doc td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
    .doc th { background: #fbf9f5; }
    .doc pre { background: #2b2a28; color: #f6f4f1; padding: 14px; border-radius: 10px; overflow-x: auto; font-size: 0.85rem; line-height: 1.5; }
    .doc code { font-family: ui-monospace, "Consolas", "Courier New", monospace; }
    .doc p code, .doc li code, .doc td code { background: #fff3e2; padding: 1px 6px; border-radius: 4px; color: var(--accent-dark); font-size: 0.9em; }
    .doc blockquote {
      background: #fdf3e7;
      border-left: 3px solid var(--accent);
      margin: 14px 0;
      padding: 10px 14px;
      border-radius: 6px;
      color: var(--muted);
    }
    .doc ul, .doc ol { padding-left: 22px; }
    .doc li { margin: 4px 0; }
    .doc hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
    .doc .warn {
      background: #fdecec;
      border-left: 3px solid var(--danger);
      padding: 10px 14px;
      border-radius: 6px;
      margin: 14px 0;
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="doc">
    <div class="doc-toolbar">
      <a class="btn btn-ghost" href="../index.html">← 返回</a>
      <div class="lang-switch-inline">
        <button id="lang-zh" class="lang-btn active" type="button">中</button>
        <button id="lang-en" class="lang-btn" type="button">EN</button>
      </div>
      <button id="download-md" class="btn" type="button">下载 Markdown</button>
    </div>
    <div id="content">加载中…</div>
  </div>

  <script src="../js/float-words.js"></script>
  <script>
    (function () {
      'use strict';

      /* ---------- 转义层：先转义 HTML，再按 markdown 语法渲染 ---------- */
      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // 行内语法：`code`、**粗体**、[文本](链接)
      function inline(s) {
        s = escapeHtml(s);
        s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
        s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
        s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
        return s;
      }

      function parseRow(line) {
        var s = line.trim();
        if (s.charAt(0) === '|') s = s.slice(1);
        if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
        return s.split('|').map(function (c) { return c.trim(); });
      }

      function renderTable(rows) {
        var header = parseRow(rows[0]);
        var bodyStart = 1;
        if (rows[1] && /^\|[\s:|-]+\|?$/.test(rows[1].trim())) bodyStart = 2;
        var html = '<table><thead><tr>';
        header.forEach(function (c) { html += '<th>' + inline(c) + '</th>'; });
        html += '</tr></thead><tbody>';
        for (var r = bodyStart; r < rows.length; r++) {
          var cells = parseRow(rows[r]);
          html += '<tr>';
          cells.forEach(function (c) { html += '<td>' + inline(c) + '</td>'; });
          html += '</tr>';
        }
        return html + '</tbody></table>';
      }

      function renderMarkdown(src) {
        var codeBlocks = [];
        // 先取出围栏代码块，避免其内容被当作普通文本处理
        src = src.replace(/```([\s\S]*?)```/g, function (m, inner) {
          inner = inner.replace(/^\w+\n/, '');            // 去掉语言标识行
          inner = inner.replace(/^\n/, '').replace(/\n$/, '');
          var idx = codeBlocks.push('<pre><code>' + escapeHtml(inner) + '</code></pre>');
          return '\u0000CODE' + (idx - 1) + '\u0000';
        });

        var lines = src.split('\n');
        var out = [];
        var i = 0;

        while (i < lines.length) {
          var t = lines[i].trim();

          var cm = t.match(/^\u0000CODE(\d+)\u0000$/);
          if (cm) { out.push(codeBlocks[+cm[1]]); i++; continue; }

          if (t === '') { i++; continue; }

          if (/^(-{3,}|\*{3,})$/.test(t)) { out.push('<hr>'); i++; continue; }

          var h = t.match(/^(#{1,6})\s+(.*)$/);
          if (h) { out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); i++; continue; }

          if (t.charAt(0) === '|') {
            var rows = [];
            while (i < lines.length && lines[i].trim().charAt(0) === '|') { rows.push(lines[i].trim()); i++; }
            out.push(renderTable(rows));
            continue;
          }

          if (/^[-*+]\s+/.test(t)) {
            var items = [];
            while (i < lines.length) {
              var lt = lines[i].trim();
              if (/^[-*+]\s+/.test(lt)) {
                items.push(inline(lt.replace(/^[-*+]\s+/, '')));
                i++;
              } else if (lt !== '' && /^[ \t]/.test(lines[i]) && items.length) {
                items[items.length - 1] += ' ' + inline(lt);
                i++;
              } else {
                break;
              }
            }
            out.push('<ul>' + items.map(function (it) { return '<li>' + it + '</li>'; }).join('') + '</ul>');
            continue;
          }

          if (/^\d+\.\s+/.test(t)) {
            var oitems = [];
            while (i < lines.length) {
              var lt2 = lines[i].trim();
              if (/^\d+\.\s+/.test(lt2)) {
                oitems.push(inline(lt2.replace(/^\d+\.\s+/, '')));
                i++;
              } else if (lt2 !== '' && /^[ \t]/.test(lines[i]) && oitems.length) {
                oitems[oitems.length - 1] += ' ' + inline(lt2);
                i++;
              } else {
                break;
              }
            }
            out.push('<ol>' + oitems.map(function (it) { return '<li>' + it + '</li>'; }).join('') + '</ol>');
            continue;
          }

          if (t.charAt(0) === '>') {
            var q = [];
            while (i < lines.length && lines[i].trim().charAt(0) === '>') {
              q.push(lines[i].trim().replace(/^>\s?/, ''));
              i++;
            }
            out.push('<blockquote>' + inline(q.join(' ')) + '</blockquote>');
            continue;
          }

          var para = [];
          while (i < lines.length && lines[i].trim() !== '') {
            para.push(lines[i].trim());
            i++;
          }
          out.push('<p>' + inline(para.join(' ')) + '</p>');
        }

        return out.join('\n');
      }

      /* ---------- 页面逻辑：fetch md → 渲染 → 下载（中/英） ---------- */
      var content = document.getElementById('content');
      var mdSource = '';
      var lang = 'zh';
      var FILES = { zh: 'kernel-spec.md', en: 'kernel-spec.en.md' };

      function loadDoc(l) {
        lang = l;
        document.getElementById('lang-zh').classList.toggle('active', l === 'zh');
        document.getElementById('lang-en').classList.toggle('active', l === 'en');
        window.FloatWords.start(l);
        content.innerHTML = '加载中…';
        fetch(FILES[l])
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          })
          .then(function (text) {
            mdSource = text;
            content.innerHTML = renderMarkdown(text);
          })
          .catch(function (e) {
            content.innerHTML = '<div class="warn">加载内核规范失败：' + escapeHtml(e.message) + '</div>';
          });
      }

      document.getElementById('lang-zh').addEventListener('click', function () { loadDoc('zh'); });
      document.getElementById('lang-en').addEventListener('click', function () { loadDoc('en'); });

      document.getElementById('download-md').addEventListener('click', function () {
        if (!mdSource) return;
        var blob = new Blob([mdSource], { type: 'text/markdown;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = FILES[lang];
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      loadDoc('zh');
    })();
  </script>
</body>
</html>
